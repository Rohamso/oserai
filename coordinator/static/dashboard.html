<title>Distributed Inference Network</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; margin: 2rem; max-width: 1000px; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #8884; }
  .status-idle { color: #2a7; font-weight: 600; }
  .status-busy { color: #c90; font-weight: 600; }
  .status-offline { color: #c33; font-weight: 600; }
  .summary { display: flex; gap: 2rem; flex-wrap: wrap; margin: 1rem 0; }
  .stat { background: #8881; border-radius: 8px; padding: 0.75rem 1.25rem; }
  .stat .value { font-size: 1.4rem; font-weight: 700; display: block; }
  .stat .label { font-size: 0.75rem; opacity: 0.7; }
  .progress-bar { background: #8883; border-radius: 6px; overflow: hidden; height: 18px; width: 100%; }
  .progress-fill { background: #2a7; height: 100%; text-align: center; font-size: 0.7rem; color: white; line-height: 18px; white-space: nowrap; }
  .batch-block { margin-bottom: 1.25rem; }
  .muted { opacity: 0.6; font-size: 0.8rem; }
</style>

<h1>Distributed Inference Network</h1>
<div class="summary" id="summary"></div>

<h2>Active Batches</h2>
<div id="batches"></div>

<h2>Nodes</h2>
<table id="nodes-table">
  <thead>
    <tr>
      <th>Name</th><th>Role</th><th>Status</th><th>Jobs Done</th><th>Failed</th>
      <th>Tok/s</th><th>Failure %</th><th>Mismatches</th><th>Uptime %</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>Training Runs</h2>
<div id="training-runs"></div>

<h2>Talk to a trained run</h2>
<div id="generate-panel" class="muted">No completed-or-in-progress run yet.</div>

<p class="muted">Polling /stats every 5s, /training/runs every 5s.</p>

<script>
async function refresh() {
  let res;
  try {
    res = await fetch("/stats");
  } catch (e) {
    return;
  }
  if (!res.ok) return;
  const data = await res.json();

  document.getElementById("summary").innerHTML = `
    <div class="stat"><span class="value">${data.aggregate_tokens_per_sec.toFixed(1)}</span><span class="label">tokens/sec (network)</span></div>
    <div class="stat"><span class="value">${data.nodes.filter(n => n.status !== 'offline').length} / ${data.nodes.length}</span><span class="label">nodes online</span></div>
    <div class="stat"><span class="value">${data.cumulative_payout.toFixed(6)}</span><span class="label">cumulative simulated payout</span></div>
  `;

  const batchesEl = document.getElementById("batches");
  if (data.batches.length === 0) {
    batchesEl.innerHTML = '<p class="muted">No batches submitted yet.</p>';
  } else {
    batchesEl.innerHTML = data.batches.map(b => {
      const done = b.completed + b.verified + b.mismatched + b.failed;
      const pct = b.total_jobs ? Math.round((done / b.total_jobs) * 100) : 0;
      const eta = b.eta_seconds === null ? "?" : `${Math.round(b.eta_seconds)}s`;
      return `
        <div class="batch-block">
          <div><b>${b.batch_id.slice(0, 8)}</b> (${b.model_name}) &mdash;
            ${done}/${b.total_jobs} done, ${b.retry_count} retries, ETA ${eta}, ${b.throughput_tokens_per_sec.toFixed(1)} tok/s</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%">${pct}%</div></div>
        </div>`;
    }).join("");
  }

  const tbody = document.querySelector("#nodes-table tbody");
  tbody.innerHTML = data.nodes.map(n => `
    <tr>
      <td>${n.name}</td>
      <td>${n.role}</td>
      <td class="status-${n.status}">${n.status}</td>
      <td>${n.jobs_done}</td>
      <td>${n.jobs_failed}</td>
      <td>${n.tokens_per_sec_avg.toFixed(1)}</td>
      <td>${(n.failure_rate * 100).toFixed(1)}</td>
      <td>${n.mismatch_count}</td>
      <td>${n.uptime_pct.toFixed(0)}</td>
    </tr>`).join("");
}

async function refreshTraining() {
  let res;
  try {
    res = await fetch("/training/runs");
  } catch (e) {
    return; // torch not installed on this coordinator -- route doesn't exist, stay quiet
  }
  if (!res.ok) return;
  const runs = await res.json();

  const runsEl = document.getElementById("training-runs");
  if (runs.length === 0) {
    runsEl.innerHTML = '<p class="muted">No training runs yet. POST /training/runs to start one.</p>';
  } else {
    runsEl.innerHTML = runs.map(r => {
      const pct = r.max_rounds ? Math.min(100, Math.round((r.current_round / r.max_rounds) * 100)) : 0;
      return `
        <div class="batch-block">
          <div><b>${r.name}</b> (${r.id.slice(0, 8)}) &mdash;
            ${r.status}, round ${r.current_round}/${r.max_rounds}, dataset ${r.dataset_name}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%">${pct}%</div></div>
        </div>`;
    }).join("");
  }

  const genPanel = document.getElementById("generate-panel");
  const usableRuns = runs.filter(r => r.latest_checkpoint_id);
  if (usableRuns.length === 0) {
    genPanel.innerHTML = '<p class="muted">No completed-or-in-progress run yet.</p>';
    return;
  }
  if (!genPanel.dataset.built) {
    genPanel.innerHTML = `
      <select id="gen-run"></select>
      <p class="muted" style="margin:0.25rem 0;">dolly_chat runs: type a question/instruction, answered chat-style.
        Other runs: raw text completion.</p>
      <textarea id="gen-prompt" rows="2" style="width:100%;" placeholder="Prompt or question"></textarea>
      <button id="gen-button" style="margin-top:0.5rem;">Generate</button>
      <pre id="gen-output" class="muted" style="white-space:pre-wrap;margin-top:0.5rem;"></pre>
    `;
    document.getElementById("gen-button").addEventListener("click", async () => {
      const runId = document.getElementById("gen-run").value;
      const prompt = document.getElementById("gen-prompt").value;
      const out = document.getElementById("gen-output");
      out.textContent = "generating...";
      try {
        const r = await fetch(`/training/runs/${runId}/generate`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt, max_new_tokens: 300, temperature: 0.8}),
        });
        const body = await r.json();
        out.textContent = r.ok ? body.text : `error: ${body.detail}`;
      } catch (e) {
        out.textContent = `error: ${e}`;
      }
    });
    genPanel.dataset.built = "1";
  }
  const select = document.getElementById("gen-run");
  select.innerHTML = usableRuns.map(r => `<option value="${r.id}">${r.name} [${r.dataset_name}] (${r.status}, round ${r.current_round})</option>`).join("");
}

refresh();
refreshTraining();
setInterval(refresh, 5000);
setInterval(refreshTraining, 5000);
</script>
