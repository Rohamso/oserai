name: Build desktop app

# Manual only -- this packages desktop_app/ (agent/train_agent.py + a PySide6
# GUI) into a standalone Windows .exe via PyInstaller. PyInstaller doesn't
# cross-compile, so a real Windows runner is needed; there's no Windows
# machine in this repo's normal dev loop to build it on otherwise.
#
# coordinator_url/run_id are patched into the two hardcoded QLineEdit
# defaults in desktop_app/main.py before building, then discarded --
# nothing here is committed back, so a pilot's specific coordinator address
# never lands in source control.
on:
  workflow_dispatch:
    inputs:
      coordinator_url:
        description: "Default Coordinator URL to bake in (e.g. http://100.x.y.z:8000)"
        required: false
        default: ""
      run_id:
        description: "Default training run ID to bake in"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # pytest itself only lives in requirements.txt (the base
        # coordinator/agent deps), which requirements-desktop.txt doesn't
        # pull in -- needed here to run the smoke test step below.
        run: pip install -r requirements-desktop.txt pytest

      - name: Fetch training data
        # dolly15k_chat.txt/tinystories.txt are gitignored (fetched on
        # demand, see prepare_training_data.py's docstring) -- a fresh CI
        # checkout doesn't have them, so without this step build.spec's
        # training/data datas entry only picks up tiny_shakespeare.txt
        # (the one file actually committed), and the packaged app crashes
        # loading the dolly_chat dataset on a contributor's machine.
        run: python scripts/prepare_training_data.py

      - name: Cache Hugging Face model download
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-qwen2.5-1.5b-instruct

      - name: Real-model training smoke test
        # Everything else in tests/ exercises dispatch/aggregation against
        # small hand-built tensors -- fast, but nothing there ever actually
        # loads the real base model or runs a real local step, so failures
        # specific to that path (bad from_pretrained kwargs, an OOM that
        # crashes the process instead of raising, ...) had no test to catch
        # them before a contributor's machine did. Run it here, on the same
        # OS the packaged app ships for, before spending time building and
        # uploading an artifact that can't actually complete a round.
        run: python -m pytest -m smoke tests/test_lora_smoke.py -v

      - name: Patch default coordinator URL / run ID
        if: ${{ inputs.coordinator_url != '' || inputs.run_id != '' }}
        shell: python
        run: |
          import pathlib
          p = pathlib.Path("desktop_app/main.py")
          text = p.read_text()
          coordinator_url = ${{ toJSON(inputs.coordinator_url) }}
          run_id = ${{ toJSON(inputs.run_id) }}
          if coordinator_url:
              text = text.replace(
                  'QLineEdit("http://localhost:8000")',
                  f'QLineEdit({coordinator_url!r})',
              )
          if run_id:
              text = text.replace(
                  "self.run_id_edit = QLineEdit()",
                  f"self.run_id_edit = QLineEdit({run_id!r})",
              )
          p.write_text(text)

      - name: Build with PyInstaller
        working-directory: desktop_app
        run: pyinstaller build.spec

      - uses: actions/upload-artifact@v4
        with:
          name: OserAI-Trainer-windows
          path: desktop_app/dist/OserAI-Trainer/
          retention-days: 14
